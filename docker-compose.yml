services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aw_user
      POSTGRES_PASSWORD: aw_pass
      POSTGRES_DB: aw_db
    command:
      - "postgres"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "shared_buffers=512MB"               # ~25% RAM: подстрой
      - "-c"
      - "effective_cache_size=2GB"           # ~50–75% RAM: подстрой
      - "-c"
      - "work_mem=16MB"                      # аккуратно при большом concurrency
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aw_user -d aw_db -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  aw-server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      AW_STORAGE: "postgresql"   # твой PostgresqlStorage выберется в wsgi по этой переменной
      POSTGRES_DSN: "host=db port=5432 dbname=aw_db user=aw_user password=aw_pass application_name=aw-server keepalives=1 keepalives_idle=30 keepalives_interval=10 keepalives_count=5 options='-c statement_timeout=30000 -c idle_in_transaction_session_timeout=30000 -c synchronous_commit=off'"
      PGPOOL_MIN: "1"
      PGPOOL_MAX: "100"
      PGCLIENT_APPNAME: "aw-server"
      AW_CORS_ORIGINS: "http://localhost:27180/*"
      XDG_DATA_HOME: "/var/lib/aw"
      AW_HOST: "0.0.0.0"
      # Gunicorn
      GUNICORN_WORKERS: "8"
      #GUNICORN_THREADS: "8"              # под CPU (ориентир: 2*ядра)
      GUNICORN_TIMEOUT: "120"
      GUNICORN_WORKER_CONNECTIONS: "1000"
      GUNICORN_WORKER_CLASS: "gevent"      # при необходимости: "gevent"
      GUNICORN_MAX_REQUESTS: "1000"
      GUNICORN_MAX_REQUESTS_JITTER: "100"
    volumes:
      - aw-data:/var/lib/aw
    ports:
      - "5600:5600"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5600/api/0/info"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  aw-data:
